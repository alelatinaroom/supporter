name: Update Results & Classifica

on:
  schedule:
    # Run daily at 21:30 UTC (23:30 Rome, after evening matches)
    - cron: '30 21 * * *'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch results & classifica
        run: node scripts/update-results.js

      - name: Compare and commit
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "alelatinaroom-bot"
            git config user.email "actions@users.noreply.github.com"
            git add js/season_results.json js/classifica.json
            git commit -m "chore(data): auto-update results & classifica ($(date +%d/%m/%Y))" || echo "no-commit"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes - skip"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report
        run: echo "Updated=${{ steps.check.outputs.updated }}"
